[build-system]
# Build requirements for the PEP 517 isolated environment.
requires = ["setuptools>=43.0.0", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/stepcount/_version.py"
versionfile_build = "stepcount/_version.py"
tag_prefix = "v"
parentdir_prefix = "stepcount"

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle imports
    "E7",   # pycodestyle statements
    "E9",   # pycodestyle runtime errors
    "F",    # Pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "I",    # isort
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
strict = true
files = ["src/stepcount"]
exclude = [
    "src/stepcount/_version\\.py$",
    "src/stepcount/torch_hub_cache/",
]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "actipy.*",
    "hmmlearn.*",
    "imblearn.*",
    "joblib.*",
    "matplotlib.*",
    "numba.*",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "tqdm.*",
    "torchvision.*",
    "transforms3d.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "model_regression: runs versioned model files against real device data",
]

[tool.coverage.run]
source = ["src/stepcount"]
branch = true
omit = [
    "src/stepcount/_version.py",
    "src/stepcount/torch_hub_cache/*",
]

[tool.coverage.report]
fail_under = 87
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
