name: ruff

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: 'pip'

      - name: Install Ruff
        run: python -m pip install ruff==0.15.20

      - name: Check for syntax errors and undefined names
        run: ruff check . --select=E9,F63,F7,F82

      - name: Report additional lint findings
        if: always()
        run: ruff check . --exit-zero
